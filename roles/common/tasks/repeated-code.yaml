- name: delete directory
  tags:
  - deployment
  ansible.builtin.file:
    path: "{{APP_LOCATION}}"
    state: absent

- name: create directory
  tags:
  - deployment
  ansible.builtin.file:
    path: "{{APP_LOCATION}}"
    state: directory

