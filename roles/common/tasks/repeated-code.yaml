- name: download and extractcode
  ansible.builtin.unarchive:
    src: "http://{{ nexus_url }}/repository/{{ component }}/com/expense/{{ component }}/{{ app_VERSION }}/{{ component }}-{{ app_VERSION }}.zip"
    dest: "{{ APP_LOCATION }}"
    remote_src: yes
